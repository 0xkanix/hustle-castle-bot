# ===================================================================
#  Hustle Castle Bot -- Einstellungen
# ===================================================================
#
#  NORMALERWEISE MUSST DU HIER NICHTS ANFASSEN.
#
#  Discord ist freiwillig. Bot-Token und Kanal-ID traegst du hier ein
#  (oder im Einrichtungsfenster des Bots).
#
#  Von Hand: die Zeilen mit
#  >>> HIER EINTRAGEN <<< ausfuellen. NICHT mit Word oeffnen --
#  Word kann die Datei beim Speichern unbrauchbar machen.
#  Nach jeder Aenderung den Bot neu starten.
#
# ===================================================================


# --- 1. Dein Discord-Bot ------------------------------------------
#
#  Der Token deines eigenen Discord-Bots.
#  docs/GUIDE-1-SETUP-EN.txt, Schritt 4 zeigt, wie man einen erstellt.
#
#  WICHTIG: Diesen Token niemandem zeigen. Wer ihn hat, kann deinen
#  Bot fernsteuern.
#
#  >>> HIER EINTRAGEN <<<
discord.botToken=


# --- 2. Dein Befehls-Kanal ----------------------------------------
#
#  Die ID des Kanals, in den du die Befehle tippst.
#  docs/GUIDE-1-SETUP-EN.txt, Schritt 5 zeigt, wo man die ID herbekommt.
#
#  >>> HIER EINTRAGEN <<<
discord.channelId=


# --- 3. Kanal fuer die Statistik ----------------------------------
#
#  Traegt das Einrichtungsfenster von selbst ein -- dieselbe ID wie
#  oben. Wer die Statistik in einem eigenen Kanal haben will, schreibt
#  hier dessen ID hin; das Fenster ueberschreibt sie dann nicht mehr.
#
#  >>> HIER EINTRAGEN <<<
discord.statsChannelId=


# ===================================================================
#  Ab hier musst du nichts mehr anfassen.
# ===================================================================

discord.enabled=true

# Das Spielfenster. Der Bot zwingt Hustle Castle auf diese Groesse --
# alle Vorlagen sind darauf ausgemessen. Nicht aendern, sonst erkennt
# der Bot nichts mehr.
window.title=Hustle Castle
window.width=1175
window.height=809

# Wo die Bilder liegen, nach denen der Bot sucht.
templates.dir=templates

# Wie schnell der Bot hinsieht. Kleiner heisst schneller und mehr
# Rechenlast.
bot.tickDelayMillis=150

# Nach so vielen Minuten ohne Fortschritt haelt der Bot an, statt
# ins Leere zu klicken.
bot.idleTimeoutMinutes=5

# Beim Start pruefen, ob alle noetigen Vorlagen da sind.
bot.requireAllTemplates=true

# Ausfuehrliches Protokoll. Bei Problemen hilft das sehr weiter --
# lass es an.
log.debug=true

# Menschliches Verhalten (Pausen, Zoegern). Aus, weil der Bot damit
# deutlich langsamer wird.
human.enabled=false
human.intensity=0.0
human.breakMinSeconds=25
human.breakMaxSeconds=95
human.longBreakEveryRuns=5
human.longBreakMinMinutes=3
human.longBreakMaxMinutes=8
